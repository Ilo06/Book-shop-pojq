openapi: 3.1.0

info:
  title: Book Management API
  version: 2.0.0
  description: >
    API REST pour la gestion d'une librairie :
    œuvres (books), exemplaires (copies), arrivages (arrivals),
    ventes/réservations (sales) et indicateurs.

servers:
  - url: http://localhost:8080
    description: Développement local

tags:
  - name: genres
    description: Catégories de livres
  - name: authors
    description: Auteurs
  - name: books
    description: Œuvres bibliographiques
  - name: book-copies
    description: Exemplaires physiques
  - name: arrivals
    description: Réceptions de stock
  - name: sales
    description: Ventes, réservations et indicateurs financiers
  - name: health
    description: Points de监控 santé

paths:

  # Genres
  /genres:
    get:
      tags: [genres]
      summary: Liste paginée des genres
      operationId: listGenres
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema: { type: string, default: name }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseGenre'
    post:
      tags: [genres]
      summary: Crée un genre
      operationId: createGenre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenreDTO'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /genres/{genreId}:
    parameters:
      - $ref: '#/components/parameters/genreId'
    get:
      tags: [genres]
      summary: Détail d'un genre
      operationId: getGenre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [genres]
      summary: Met à jour un genre
      operationId: updateGenre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenreDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Genre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [genres]
      summary: Supprime un genre
      operationId: deleteGenre
      responses:
        '204':
          description: Supprimé
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # Authors
  /authors:
    get:
      tags: [authors]
      summary: Liste paginée des auteurs
      operationId: listAuthors
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema: { type: string, default: lastName }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseAuthor'
    post:
      tags: [authors]
      summary: Crée un auteur
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorDTO'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /authors/{authorId}:
    parameters:
      - $ref: '#/components/parameters/authorId'
    get:
      tags: [authors]
      summary: Détail d'un auteur
      operationId: getAuthor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [authors]
      summary: Met à jour un auteur
      operationId: updateAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [authors]
      summary: Supprime un auteur
      operationId: deleteAuthor
      responses:
        '204':
          description: Supprimé
        '404':
          $ref: '#/components/responses/NotFound'

  # Books
  /books:
    get:
      tags: [books]
      summary: Liste des livres (avec filtres optionnels)
      operationId: listBooks
      parameters:
        - name: genreId
          in: query
          schema: { type: string, format: uuid }
        - name: authorId
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          description: Recherche plein-texte sur titre ou ISBN
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
    post:
      tags: [books]
      summary: Crée un livre
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookDTO'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/bookId'
    get:
      tags: [books]
      summary: Détail d'un livre
      operationId: getBook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [books]
      summary: Met à jour un livre
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [books]
      summary: Supprime un livre
      operationId: deleteBook
      responses:
        '204':
          description: Supprimé
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{bookId}/stock:
    parameters:
      - $ref: '#/components/parameters/bookId'
    get:
      tags: [books]
      summary: Stock d'un livre (simple ou détaillé par type)
      operationId: getBookStock
      parameters:
        - name: detailed
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: integer
                    description: Nombre total d'exemplaires disponibles
                  - type: array
                    items:
                      $ref: '#/components/schemas/CopyStockEntry'

  /books/stock:
    get:
      tags: [books]
      summary: Stock de tous les livres
      operationId: getAllBooksStock
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockEntry'

  /books/stock/low-stock:
    get:
      tags: [books]
      summary: Livres avec stock ≤ 3
      operationId: getLowStockBooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockEntry'

  # Book Copies (sous /books/{bookId}/copies)
  /books/{bookId}/copies:
    parameters:
      - $ref: '#/components/parameters/bookId'
    get:
      tags: [book-copies]
      summary: Exemplaires d'un livre
      operationId: listBookCopies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookCopy'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [book-copies]
      summary: Crée un exemplaire
      operationId: createBookCopy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookCopyDTO'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /books/{bookId}/copies/{copyId}:
    parameters:
      - $ref: '#/components/parameters/bookId'
      - $ref: '#/components/parameters/copyId'
    get:
      tags: [book-copies]
      summary: Détail d'un exemplaire
      operationId: getBookCopy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopy'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [book-copies]
      summary: Met à jour prix et/ou emplacement
      operationId: patchBookCopy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBookCopyDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [book-copies]
      summary: Supprime un exemplaire
      operationId: deleteBookCopy
      responses:
        '201':
          description: Supprimé
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{bookId}/copies/{copyId}/stock:
    parameters:
      - $ref: '#/components/parameters/bookId'
      - $ref: '#/components/parameters/copyId'
    get:
      tags: [book-copies]
      summary: Stock disponible d'un exemplaire spécifique
      operationId: getBookCopyStock
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer

  # Arrivals
  /arrivals:
    get:
      tags: [arrivals]
      summary: Liste tous les arrivages
      operationId: listArrivals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arrival'
    post:
      tags: [arrivals]
      summary: Enregistre un arrivage
      operationId: createArrival
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateArrivalDTO'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /arrivals/{arrivalId}:
    parameters:
      - $ref: '#/components/parameters/arrivalId'
    get:
      tags: [arrivals]
      summary: Détail d'un arrivage
      operationId: getArrival
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
        '404':
          $ref: '#/components/responses/NotFound'

  # Sales
  /sales:
    get:
      tags: [sales]
      summary: Liste des ventes (filtre par plage de dates)
      operationId: listSales
      parameters:
        - name: from
          in: query
          description: Date début (ISO 8601 avec timezone, ex. 2024-01-01T00:00:00Z)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Date fin (ISO 8601 avec timezone)
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
    post:
      tags: [sales]
      summary: Enregistre une vente / réservation
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleDTO'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/BadRequest'

  /sales/{saleId}:
    parameters:
      - $ref: '#/components/parameters/saleId'
    get:
      tags: [sales]
      summary: Détail d'une vente
      operationId: getSale
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'

  /sales/{saleId}/finalize:
    parameters:
      - $ref: '#/components/parameters/saleId'
    post:
      tags: [sales]
      summary: Finalise (confirme ou rejette) une vente
      operationId: finalizeSale
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'

  /sales/today-revenue:
    get:
      tags: [sales]
      summary: Chiffre d'affaires du jour (ventes confirmées)
      operationId: getTodayRevenue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayRevenue'

  /sales/monthly-revenue:
    get:
      tags: [sales]
      summary: Chiffre d'affaires du mois en cours
      operationId: getMonthlyRevenue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyRevenue'

  /sales/top-sellers:
    get:
      tags: [sales]
      summary: Livres les plus vendus
      operationId: getTopSellers
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopSellerEntry'

  /sales/revenue-by-genre:
    get:
      tags: [sales]
      summary: Chiffre d'affaires ventilé par genre
      operationId: getRevenueByGenre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevenueByGenreEntry'

components:

  parameters:
    genreId:
      name: genreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    authorId:
      name: authorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    bookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    copyId:
      name: copyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    arrivalId:
      name: arrivalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    saleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflit (ressource déjà existante)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    # Enums
    BookCopyType:
      type: string
      enum: [HARDBACK, PAPERBACK, POCKET]

    SaleStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED]

    # Genre
    Genre:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateGenreDTO:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    PageResponseGenre:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean

    # Author
    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    CreateAuthorDTO:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100

    PageResponseAuthor:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Author'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean

    # Book
    BookSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isbn:
          type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'

    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        isbn:
          type: string
        description:
          type: string
        publishDate:
          type: string
          format: date
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/Author'

    CreateBookDTO:
      type: object
      required: [title, isbn, publishDate, genreIds, authorIds]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        isbn:
          type: string
          pattern: '^(97[89])?[0-9]{9}[0-9X]$'
          example: '9780451524935'
        description:
          type: string
        publishDate:
          type: string
          format: date
        genreIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        authorIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1

    # BookCopy
    BookCopy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/BookCopyType'
        price:
          type: number
          format: double
        location:
          type: string

    CreateBookCopyDTO:
      type: object
      required: [type, price, location]
      properties:
        type:
          $ref: '#/components/schemas/BookCopyType'
        price:
          type: number
          format: double
          minimum: 0
        location:
          type: string
          maxLength: 100

    PatchBookCopyDTO:
      type: object
      properties:
        price:
          type: number
          format: double
          minimum: 0
        location:
          type: string
          maxLength: 100

    CopyStockEntry:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/BookCopyType'
        availableCopies:
          type: integer

    # Stock
    StockEntry:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        availableCopies:
          type: integer

    # Arrival
    ArrivalBookLine:
      type: object
      properties:
        bookCopyId:
          type: string
          format: uuid
        quantity:
          type: integer

    Arrival:
      type: object
      properties:
        id:
          type: string
          format: uuid
        arrivalDateTime:
          type: string
          format: date-time
        books:
          type: array
          items:
            $ref: '#/components/schemas/ArrivalBookLine'

    QuantifiedBookCopyDTO:
      type: object
      required: [bookCopyId, quantity]
      properties:
        bookCopyId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    CreateArrivalDTO:
      type: object
      required: [arrivalDateTime, books]
      properties:
        arrivalDateTime:
          type: string
          format: date-time
        books:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuantifiedBookCopyDTO'

    # Sale
    SaleBookCopyResponse:
      type: object
      properties:
        bookCopyId:
          type: string
          format: uuid
        price:
          type: number
          format: double
        quantity:
          type: integer

    Sale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creationDateTime:
          type: string
          format: date-time
        saleStatus:
          $ref: '#/components/schemas/SaleStatus'
        finalizationDateTime:
          type: string
          format: date-time
          nullable: true
        isReservation:
          type: boolean
        books:
          type: array
          items:
            $ref: '#/components/schemas/SaleBookCopyResponse'

    CreateSaleDTO:
      type: object
      required: [creationDateTime, quantifiedBookCopyList, isReservation]
      properties:
        creationDateTime:
          type: string
          format: date-time
        quantifiedBookCopyList:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuantifiedBookCopyDTO'
        isReservation:
          type: boolean

    # Dashboard / Revenue
    TodayRevenue:
      type: object
      properties:
        todayRevenue:
          type: number
          format: double

    MonthlyRevenue:
      type: object
      properties:
        monthlyRevenue:
          type: number
          format: double

    TopSellerEntry:
      type: object
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        unitsSold:
          type: integer

    RevenueByGenreEntry:
      type: object
      properties:
        genreId:
          type: string
          format: uuid
